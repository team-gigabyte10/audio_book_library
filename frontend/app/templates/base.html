<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ app_name }}{% endblock %}</title>
    
    <!-- Google Fonts: Noto Sans Bengali & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+Bengali:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Application Stylesheet -->
    <link rel="stylesheet" href="/static/css/style.css">
    {% block head %}{% endblock %}
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="/" class="brand">
                <div class="brand-icon">
                    <i class="fa-solid fa-book-open-reader"></i>
                </div>
                <div class="brand-text">
                    <span class="brand-title">বাংলা বই এক্সট্র্যাক্টর</span>
                    <span class="brand-subtitle">Bangla Book Text Extractor</span>
                </div>
            </a>
            
            <div class="nav-links">
                <a href="/" class="nav-item"><i class="fa-solid fa-house"></i> ড্যাশবোর্ড</a>
                <span class="nav-badge">v1.0 (PDF Engine)</span>
            </div>
        </div>
    </nav>

    <!-- Main Content Container -->
    <main class="main-wrapper">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-container">
            <p><i class="fa-solid fa-cube"></i> Bangla Audiobook Platform — PDF Text Extraction & Cleaning Engine</p>
        </div>
    </footer>

    {% block scripts %}{% endblock %}
</body>
</html>
